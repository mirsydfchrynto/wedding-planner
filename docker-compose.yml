services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tatanikah_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: "Tatanikah"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: wedding_planner
      DB_USERNAME: tatanikah
      DB_PASSWORD: tatanikah_secret_2026
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_DEMO_LOGIN: "true"
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tatanikah_network

  web:
    image: nginx:alpine
    container_name: tatanikah_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - app_storage:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - tatanikah_network

  postgres:
    image: postgres:16-alpine
    container_name: tatanikah_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wedding_planner
      POSTGRES_USER: tatanikah
      POSTGRES_PASSWORD: tatanikah_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tatanikah -d wedding_planner"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tatanikah_network

  redis:
    image: redis:7-alpine
    container_name: tatanikah_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tatanikah_network

volumes:
  postgres_data:
  redis_data:
  app_storage:

networks:
  tatanikah_network:
    driver: bridge
